[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-livestock-gate"
version = "0.1.0"
description = "Farm-animal classification prototype for a smart livestock gate."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4",
    "flask-cors>=4.0,<7",
    "joblib>=1.3,<2",
    "numpy>=1.26,<3",
    "opencv-python>=4.8,<5",
    "openpyxl>=3.1,<4",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
]
vision = [
    "filterpy>=1.4,<2",
    "matplotlib>=3.8,<4",
    "pandas>=2.2,<3",
    "scikit-image>=0.23,<1",
    "scipy>=1.12,<2",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "ultralytics>=8.2,<9",
]

[project.scripts]
livestock-gate = "smart_livestock_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
